name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'task/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel 13

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout laravel-flow-connect
        uses: actions/checkout@v4
        with:
          path: laravel-flow-connect

      # padosoft/laravel-flow has no tagged release yet, so composer.json
      # resolves it via a local path repository ("../padosoft-laravel-flow"
      # relative to this package's root) — mirror that layout here by
      # checking core out as a TRUE sibling directory, one level up from
      # laravel-flow-connect, matching what a local dev checkout looks like.
      - name: Checkout padosoft/laravel-flow (path-repo sibling)
        uses: actions/checkout@v4
        with:
          repository: padosoft/laravel-flow
          ref: main
          path: padosoft-laravel-flow

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo, tokenizer, xml, ctype, json, intl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        working-directory: laravel-flow-connect
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        working-directory: laravel-flow-connect
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint (style check)
        working-directory: laravel-flow-connect
        run: composer format:test

      - name: Run PHPStan
        working-directory: laravel-flow-connect
        run: composer analyse

      - name: Run PHPUnit suites
        working-directory: laravel-flow-connect
        run: composer test
